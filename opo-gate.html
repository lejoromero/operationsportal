  .staticrypt-html{height:100%;}

  .staticrypt-content{

    -webkit-font-smoothing:antialiased;
  }
  /* ---- ambient blobs, mouse reactive ---- */
  .opo-blobs{position:absolute;inset:-10%;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform;transition:transform 1.1s cubic-bezier(.22,.61,.36,1);}
  .blob-1{width:560px;height:560px;background:#D6E7F3;top:-140px;right:-80px;animation:drift1 16s ease-in-out infinite alternate;}
  .blob-2{width:460px;height:460px;background:#BFE4F5;bottom:-160px;left:-100px;animation:drift2 19s ease-in-out infinite alternate;}
  .blob-3{width:340px;height:340px;background:#E8E1F1;top:38%;left:14%;opacity:.55;animation:drift3 22s ease-in-out infinite alternate;}
  @keyframes drift1{from{translate:0 0;}to{translate:-60px 50px;}}
  @keyframes drift2{from{translate:0 0;}to{translate:70px -40px;}}
  @keyframes drift3{from{translate:0 0;}to{translate:50px 60px;}}
  @media (prefers-reduced-motion: reduce){
    .blob{animation:none;transition:none;}
  }
  /* ---- centered card ---- */
  .opo-wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;}
  .opo-card{
    position:relative;z-index:2;width:420px;max-width:100%;
    background:rgba(255,255,255,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid #E4E4E4;border-radius:16px;
    box-shadow:0 18px 50px rgba(0,46,80,0.10);
    padding:44px 40px 40px;text-align:center;
  }
  .opo-logo{display:flex;justify-content:center;margin-bottom:18px;}
  .opo-title{font-size:22px;line-height:28px;font-weight:800;color:#272626;}
  .opo-sub{font-size:14px;line-height:20px;color:#5C5A5A;margin-top:6px;}
  .opo-form{margin-top:28px;text-align:left;}
  .staticrypt-password-container{position:relative;}
  .opo-form input[type="password"], .opo-form input[type="text"]{
    width:100%;height:48px;border:1px solid #CBCACA;border-radius:8px;
    padding:0 44px 0 14px;font-family:inherit;font-size:15px;color:#272626;
    outline:none;background:#FFFFFF;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opo-form input::placeholder{color:#8A8A8D;}
  .opo-form input:focus{border-color:#007EB6;box-shadow:0 0 0 3px rgba(0,126,182,0.15);}
  .staticrypt-toggle-password-visibility{
    cursor:pointer;height:18px;width:18px;opacity:.55;
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
  }
  .staticrypt-toggle-password-visibility:hover{opacity:.85;}
  .opo-error{
    margin-top:8px;font-size:13px;line-height:18px;color:#B3261E;font-weight:500;
  }
  label.staticrypt-remember{
    display:flex;align-items:center;gap:8px;margin:16px 0 20px;
    font-size:14px;color:#43424B;cursor:pointer;user-select:none;
  }
  .staticrypt-remember input[type="checkbox"]{
    width:16px;height:16px;accent-color:#007EB6;cursor:pointer;
  }
  .staticrypt-decrypt-button{
    width:100%;height:48px;border:none;border-radius:80px;cursor:pointer;
    background:#007EB6;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:600;
    transition:background .15s ease;
  }
  .staticrypt-decrypt-button:hover{background:#00629D;}
  .staticrypt-decrypt-button:active{background:#004575;}
  .opo-foot{margin-top:22px;font-size:12px;color:#8A8A8D;}
  .hidden{display:none !important;}
  /* ---- loading spinner ---- */
  .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;}
  .staticrypt-spinner{
    display:inline-block;width:2rem;height:2rem;
    border:.25em solid #CBCACA;border-right-color:transparent;border-radius:50%;
    animation:spinner-border .75s linear infinite;
  }
  @keyframes spinner-border{100%{transform:rotate(360deg);}}

    // mouse parallax on the background blobs
    (function () {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var blobs = document.querySelectorAll(".blob");
      var depths = [26, 40, 18];
      document.addEventListener("mousemove", function (e) {
        var x = e.clientX / window.innerWidth - 0.5;
        var y = e.clientY / window.innerHeight - 0.5;
        blobs.forEach(function (b, i) {
          b.style.transform = "translate(" + (-x * depths[i]) + "px," + (-y * depths[i]) + "px)";
